[package]
name = "hayro-interpret"
version = "0.9.0"
description = "A crate for interpreting PDF files."
edition = "2024"
rust-version = "1.92"
authors = ["Laurenz Stampfl <laurenz.stampfl@gmail.com>"]
repository = "https://github.com/LaurenzV/hayro"
license = "Apache-2.0 OR MIT"
readme = "README.md"

[dependencies]
hayro-cmap = { git = "https://github.com/LaurenzV/hayro", rev = "e7ada1354dff4041cdeed3d8ba56fe01b6186132", default-features = false }
hayro-font = { git = "https://github.com/LaurenzV/hayro", rev = "e7ada1354dff4041cdeed3d8ba56fe01b6186132", default-features = false }
hayro-postscript = { git = "https://github.com/LaurenzV/hayro", rev = "e7ada1354dff4041cdeed3d8ba56fe01b6186132", default-features = false }
hayro-syntax = { git = "https://github.com/LaurenzV/hayro", rev = "e7ada1354dff4041cdeed3d8ba56fe01b6186132", default-features = false, features = ["std", "images", "unsafe"] }
kurbo = "0.13.0"
smallvec = "1"
moxcms = { version = "0.8.1", features = ["in_place"] }
siphasher = "1"
bitflags = "2.10"
rustc-hash = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = ["embed-fonts", "embed-cmaps"]
# Embed a light-weight set of fonts (around 240KB) that can be used as a substitute for the 14 PDF standard fonts.
embed-fonts = ["hayro-font/embed-fonts"]
# Embed the 61 predefined cmaps into the binary. Adds about ~250KB of brotli-encoded data.
embed-cmaps = ["hayro-cmap/embed-cmaps"]
