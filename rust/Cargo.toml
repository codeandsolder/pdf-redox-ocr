[package]
name = "pdf-redox-ocr"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codeandsolder/pdf-redox-ocr"
description = "Native Rust structure-aware PDF optical character recognition"

[dependencies]
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
num-traits = "0.2"
unicode-normalization = "0.1"
clap = { version = "4.5", features = ["derive"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["pnm", "png"] }
pdf-redox = { git = "https://github.com/codeandsolder/pdf-redox", rev = "3f00775cb6d38561451d226adf5125d7b0bf554c", package = "pdf-redox", optional = true }
oar-ocr = { version = "=0.10.2", features = ["auto-download"], optional = true }
tempfile = "3.27"
hayro-syntax = { git = "https://github.com/LaurenzV/hayro", rev = "e7ada1354dff4041cdeed3d8ba56fe01b6186132", default-features = false, features = ["std", "images"], optional = true }
hayro-interpret = { git = "https://github.com/codeandsolder/hayro", rev = "8d13eea0e2de878b228df918ec631bd8bf1b23a7", optional = true }

# Cargo does not propagate dependency workspace patches. Reuse the exact
# generated standalone syntax snapshot in the pinned pdf-redox repository.
[patch."https://github.com/LaurenzV/hayro"]
hayro-syntax = { git = "https://github.com/codeandsolder/pdf-redox", rev = "3f00775cb6d38561451d226adf5125d7b0bf554c" }

[patch."https://github.com/codeandsolder/hayro"]
hayro-syntax = { git = "https://github.com/codeandsolder/pdf-redox", rev = "3f00775cb6d38561451d226adf5125d7b0bf554c" }

[features]
default = ["native-inference", "pdf-integration", "cli"]
cli = ["dep:clap"]
pdf-integration = ["dep:pdf-redox", "dep:hayro-syntax", "dep:hayro-interpret"]
native-inference = ["dep:oar-ocr"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[[bin]]
name = "pdf-redox-ocr"
path = "src/bin/pdf-redox-ocr.rs"
required-features = ["native-inference", "pdf-integration", "cli"]

[[bin]]
name = "pdf-redox-ocr-refine"
path = "src/bin/pdf-redox-ocr-refine.rs"
required-features = ["native-inference", "pdf-integration", "cli"]

[[bin]]
name = "pdf-redox-ocr-eval"
path = "src/bin/pdf-redox-ocr-eval.rs"
required-features = ["cli"]

[[bin]]
name = "pdf-redox-ocr-glyph-audit"
path = "src/bin/pdf-redox-ocr-glyph-audit.rs"
required-features = ["cli"]

[[bin]]
name = "pdf-redox-ocr-line-audit"
path = "src/bin/pdf-redox-ocr-line-audit.rs"
required-features = ["pdf-integration", "cli"]

[[bin]]
name = "pdf-redox-ocr-compare"
path = "src/bin/pdf-redox-ocr-compare.rs"
required-features = ["cli"]

[[bin]]
name = "pdf-redox-ocr-glyph-match"
path = "src/bin/pdf-redox-ocr-glyph-match.rs"
required-features = ["cli"]
