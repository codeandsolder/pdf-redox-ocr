[package]
name = "pdf-redox-ocr"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codeandsolder/pdf-redox-ocr"
description = "Native Rust structure-aware PDF optical character recognition"

[dependencies]
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
num-traits = "0.2"
unicode-normalization = "0.1"
clap = { version = "4.5", features = ["derive"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["pnm", "png"] }
pdf-redox = { git = "https://github.com/codeandsolder/pdf-redox", rev = "e41dc5457f26287db8d1a4d75c93e6260a281e82", package = "pdf-redox", optional = true, features = ["interpret"] }
oar-ocr = { version = "=0.11.0", default-features = false, features = ["auto-download", "download-binaries", "simd"], optional = true }
tempfile = "3.27"


[features]
default = ["native-inference", "pdf-integration", "cli"]
cli = ["dep:clap"]
pdf-integration = ["dep:pdf-redox"]
native-inference = ["dep:oar-ocr"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[[bin]]
name = "pdf-redox-ocr"
path = "src/bin/pdf-redox-ocr.rs"
required-features = ["native-inference", "pdf-integration", "cli"]

[[bin]]
name = "pdf-redox-ocr-refine"
path = "src/bin/pdf-redox-ocr-refine.rs"
required-features = ["native-inference", "pdf-integration", "cli"]

[[bin]]
name = "pdf-redox-ocr-eval"
path = "src/bin/pdf-redox-ocr-eval.rs"
required-features = ["cli"]

[[bin]]
name = "pdf-redox-ocr-glyph-audit"
path = "src/bin/pdf-redox-ocr-glyph-audit.rs"
required-features = ["cli"]

[[bin]]
name = "pdf-redox-ocr-line-audit"
path = "src/bin/pdf-redox-ocr-line-audit.rs"
required-features = ["pdf-integration", "cli"]

[[bin]]
name = "pdf-redox-ocr-compare"
path = "src/bin/pdf-redox-ocr-compare.rs"
required-features = ["cli"]

[[bin]]
name = "pdf-redox-ocr-glyph-match"
path = "src/bin/pdf-redox-ocr-glyph-match.rs"
required-features = ["cli"]

[[bin]]
name = "pdf-redox-ocr-candidate-rank"
path = "src/bin/pdf-redox-ocr-candidate-rank.rs"
required-features = ["cli"]

[[bin]]
name = "pdf-redox-ocr-fragment-reconcile"
path = "src/bin/pdf-redox-ocr-fragment-reconcile.rs"
required-features = ["native-inference", "pdf-integration", "cli"]

[patch.crates-io]
oar-ocr = { git = "https://github.com/codeandsolder/cargo-patches.git", branch = "generated/oar-image-features" }
oar-ocr-core = { git = "https://github.com/codeandsolder/cargo-patches.git", branch = "generated/oar-image-features" }
png = { git = "https://github.com/codeandsolder/cargo-patches.git", branch = "generated/ksp-image-codecs" }
zlib-rs = { git = "https://github.com/codeandsolder/zlib-rs-fast", rev = "1f746b2e90019666a0afadfb49740a5d13908296" }
ort = { git = "https://github.com/codeandsolder/cargo-patches.git", branch = "generated/oar-image-features" }
ort-sys = { git = "https://github.com/codeandsolder/cargo-patches.git", branch = "generated/oar-image-features" }
