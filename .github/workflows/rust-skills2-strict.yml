name: Strict Rust

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@ccfa9833ce7f04c074194ace7b42ab89d91ecc9d # main
    with:
      working-directory: rust
      apt-packages: poppler-utils

  merge-gate:
    name: Strict Rust merge gate
    if: ${{ always() }}
    needs: [strict-rust]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@6beddaa012211f3fbdd57df1f37424b3001b7475 # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: '[["strict-rust","success"]]'
