name: Strict Rust

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@535609a4878f34a6697afea7ba3da04a454cc5f4 # main
    with:
      working-directory: rust
      apt-packages: poppler-utils

  merge-gate:
    name: Strict Rust merge gate
    if: ${{ always() }}
    needs: [strict-rust]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@c91a4c750313d013131dd9b5cda15d1523cf81b6 # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: '[["strict-rust","success"]]'
