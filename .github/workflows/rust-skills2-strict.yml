name: Strict Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@bbf10fc888e22a266c3df73c16cceb4b6624895f # main
    with:
      working-directory: rust
      apt-packages: poppler-utils
