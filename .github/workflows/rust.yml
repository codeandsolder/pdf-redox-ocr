name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stable-core:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@5b073b2f545404d05f56ab674e9c4ace7295c525 # main
    with:
      command: |
        bash -n run-auto.sh
        bash tests/test_run_auto.sh
        cd rust
        cargo fmt --all -- --check
        cargo clippy --locked --all-targets --no-default-features -- -D warnings
        cargo test --locked --no-default-features
        RUSTDOCFLAGS=-Dwarnings cargo doc --locked --no-default-features --no-deps
      rust-components: "rustfmt clippy"
  native-pdf:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@5b073b2f545404d05f56ab674e9c4ace7295c525 # main
    with:
      command: |
        bash .github/scripts/check-native-dependencies.sh
        cd rust
        cargo clippy --locked --all-targets --all-features -- -D warnings
        cargo test --locked --all-features
        RUSTDOCFLAGS=-Dwarnings cargo doc --locked --all-features --no-deps
      rust-components: "clippy"

  merge-gate:
    name: Rust CI merge gate
    if: ${{ always() }}
    needs: [stable-core, native-pdf]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@5b073b2f545404d05f56ab674e9c4ace7295c525 # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: '[["stable-core","success"],["native-pdf","success"]]'
