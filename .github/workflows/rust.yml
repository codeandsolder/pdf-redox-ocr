name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-core:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@77dd7bb7dcbb8450e335bbbd1c47591733dc79a4 # main
    with:
      command: |
        cd rust
        cargo fmt --all -- --check
        cargo clippy --locked --all-targets --no-default-features -- -D warnings
        cargo test --locked --no-default-features
        RUSTDOCFLAGS=-Dwarnings cargo doc --locked --no-default-features --no-deps
      rust-toolchain: "1.100.0"
      rust-components: "rustfmt clippy"
  native-pdf:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@77dd7bb7dcbb8450e335bbbd1c47591733dc79a4 # main
    with:
      command: |
        if ! command -v pdfimages >/dev/null || ! command -v pdftoppm >/dev/null || ! command -v pdftotext >/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
        fi
        cd rust
        cargo clippy --locked --all-targets --all-features -- -D warnings
        cargo test --locked --all-features
        RUSTDOCFLAGS=-Dwarnings cargo doc --locked --all-features --no-deps
      rust-toolchain: "nightly-2026-11-17"
      rust-components: "clippy"
