name: OCR verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ocr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Ruff and Poppler structural OCR tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-liberation
      - name: Lint and format
        run: |
          uvx ruff check --select E4,E7,E9,F .
          uvx ruff format --check .
          bash -n run-auto.sh
      - name: Verify native words, source-paint masking and PDF display geometry
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          uv run --python 3.12 tests/test_pdf_geometry.py
          uv run --python 3.12 tests/test_mask_native_text.py
          uv run --python 3.12 tests/test_mask_paint_invocations.py
          uv run --python 3.12 tests/test_raster_mosaic.py
          uv run --python 3.12 tests/test_ocr_fragment_groups.py
          uv run --python 3.12 tests/test_raster_hybrid.py
